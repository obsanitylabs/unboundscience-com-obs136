# OBS-125 — Netlify config for the Unbound Science site.
# Analytics: netlify/functions (collector, insights, retention purge) + Netlify Blobs storage.
# The legacy deploy.sh path (VPS /mockup-unbound) still works for the static build, but the
# analytics functions + Blobs storage only run on the Netlify instance (board direction 2026-10-30).

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# OBS-226 — admin page is never indexed and never cached.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"

# OBS-125/163 — API routes → functions (Vite static site; no framework rewrites).
[[redirects]]
  from = "/api/collect"
  to = "/.netlify/functions/collect"
  status = 200

[[redirects]]
  from = "/api/insights"
  to = "/.netlify/functions/insights"
  status = 200

[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# OBS-203/OBS-577 — waitlist capture. The functions also declare these paths in
# their own `config`, but pin the explicit rules here so publication does not
# depend on the function-path resolution order. `/api/waitlist` must target the
# `waitlist-submit` function (the previous target `/.netlify/functions/waitlist`
# did not exist, so /api/waitlist 404'd).
[[redirects]]
  from = "/api/waitlist"
  to = "/.netlify/functions/waitlist-submit"
  status = 200

[[redirects]]
  from = "/api/waitlist/confirm"
  to = "/.netlify/functions/waitlist-confirm"
  status = 200

[[redirects]]
  from = "/api/waitlist/unsubscribe"
  to = "/.netlify/functions/waitlist-unsubscribe"
  status = 200

[[redirects]]
  from = "/api/waitlist/event"
  to = "/.netlify/functions/waitlist-event"
  status = 200

[[redirects]]
  from = "/api/waitlist/stats"
  to = "/.netlify/functions/waitlist-stats"
  status = 200

[[redirects]]
  from = "/api/waitlist/export"
  to = "/.netlify/functions/waitlist-export"
  status = 200

[[redirects]]
  from = "/api/waitlist/outbox"
  to = "/.netlify/functions/waitlist-outbox"
  status = 200

# The waitlist page is a static file (public/waitlist/unbound-science/index.html).
# Pin it explicitly so it is served rather than relying on directory-index order.
[[redirects]]
  from = "/waitlist/unbound-science/"
  to = "/waitlist/unbound-science/index.html"
  status = 200
